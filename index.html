  <script>
    /* ============================================================
       Tailwind-tema kalibreret efter screenshots fra denconfoods.com:
       - peach/cream hero-baggrund (#FBEDDD)
       - dyb navy tekst (#0F1F2E)
       - koral accent (knapper, links, scroll-top) (#E85D4F)
       - grøn/blå logo-tones
       Fonts: Inter (UI) + Fraunces (serif section headings, som i footer).
       ============================================================ */
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream:    '#FBEDDD',   // hero/baggrund (varm peach)
            bg:       '#FAF6EF',   // sektion baggrund
            paper:    '#FFFFFF',
            ink:      '#0F1F2E',   // primær tekst + navy
            inkSoft:  '#3A4A58',
            inkMute:  '#6A7682',
            line:     '#E5DCC9',   // beige border
            lineSoft: '#EFE7D6',
            coral:    '#E85D4F',   // accent (CTA / links / scroll-top)
            coralDk:  '#C9483B',
            forest:   '#1F4F3F',   // mørkegrøn (fra logo)
            ocean:    '#1B6A8A',   // blå (fra logo)
            footer:   '#0B1922',   // bundfooter
          },
          fontFamily: {
            sans:    ['Inter', 'ui-sans-serif', 'system-ui'],

                  </p>
                  <div className="grid sm:grid-cols-3 gap-3 mt-7 relative z-10">
                    <div className="rounded-lg bg-paper/10 border border-paper/10 backdrop-blur p-4">
                      <div className="text-[10px] uppercase tracking-nav text-cream/60">Klar på</div>
                      <div className="font-display text-3xl font-semibold mt-1">{totals.prepMinutes} min</div>
                      <div className="text-xs text-cream/60">i konvektovn / pande</div>
                    </div>
                    <div className="rounded-lg bg-paper/10 border border-paper/10 backdrop-blur p-4">
                      <div className="text-[10px] uppercase tracking-nav text-cream/60">CO₂-reduktion</div>
                      <div className="font-display text-3xl font-semibold mt-1">−{totals.avgCO2}%</div>
                      <div className="text-xs text-cream/60">gns. pr. komponent</div>
                    </div>
                    <div className="rounded-lg bg-paper/10 border border-paper/10 backdrop-blur p-4">
                      <div className="text-[10px] uppercase tracking-nav text-cream/60">Svind</div>
                      <div className="font-display text-3xl font-semibold mt-1">~0%</div>
                      <div className="text-xs text-cream/60">færdigtilberedte komponenter</div>
                    </div>
                  </div>
                </div>

                <div className="grid lg:grid-cols-3 gap-6 mt-8">
                  <div className="lg:col-span-2 rounded-lg bg-paper border border-line p-6 shadow-card">
                    <h3 className="font-display text-3xl font-semibold text-ink">Konceptets ingredienser</h3>
                    <ul className="mt-4 divide-y divide-line">
                      {[
                        { label:'Protein',     item: selectedProducts.protein },
                        { label:'Brød / Bund', item: selectedProducts.base    },
                        { label:'Topping',     item: selectedProducts.topping },
                      ].map(row => (
                        <li key={row.label} className="py-3 flex items-start gap-3">
                          <div className="text-2xl">{row.item?.icon}</div>
                          <div className="flex-1">
                            <div className="text-[10px] uppercase tracking-nav text-inkMute font-bold">{row.label}</div>
                            <div className="font-semibold text-ink">{row.item?.name}</div>
                            <div className="text-xs text-inkSoft mt-0.5">{row.item?.brand} · klar på {row.item?.prepMinutes} min.</div>
                          </div>
                        </li>
                      ))}
                    </ul>

                    <div className="mt-6 rounded-lg bg-cream border border-line p-4">
                      <div className="text-[10px] uppercase tracking-nav text-coral font-bold mb-1">Køkkenvejledning</div>
                      <p className="text-sm text-ink/85">
                        Klar på <strong>{totals.prepMinutes} minutter</strong> i konvektovn ved 180°C.
                        Anret protein på bund, top med valgt topping og servér straks. Alle komponenter
                        er færdigtilberedte — minimal håndtering, maksimal hastighed.
                      </p>
                    </div>
                  </div>

                  {/* Pris-sektion (sløret indtil lead-form) */}
                  <div className="relative rounded-lg bg-paper border border-line p-6 shadow-card">
                    {!unlocked && (
                      <div className="absolute inset-0 rounded-lg bg-paper/75 backdrop-blur-[2px] z-10 flex flex-col items-center justify-center text-center p-6">
                        <div className="w-12 h-12 rounded-full bg-coral text-paper grid place-items-center text-xl">🔒</div>
                        <div className="mt-3 font-display text-xl font-semibold text-ink">Priser & varenumre er låst</div>
                        <div className="text-xs text-inkSoft mt-1 max-w-[18rem]">Udfyld formularen nedenfor for at se din portionspris, ugeøkonomi og varenumre.</div>
                      </div>
                    )}

                    <h3 className="font-display text-2xl font-semibold text-ink">Økonomi & priser</h3>
                    <div className={!unlocked ? "blurred mt-4" : "mt-4"}>
                      <div className="space-y-3">
                        <div className="flex items-baseline justify-between">
                          <span className="text-sm text-inkSoft">Portionspris</span>
                          <span className="font-display font-semibold text-ink text-xl">{totals.pricePerPortion.toFixed(2)} kr.</span>
                        </div>
                        <div className="flex items-baseline justify-between">
                          <span className="text-sm text-inkSoft">Pr. uge ({guests} gæster)</span>
                          <span className="font-display font-semibold text-ink text-xl">{Math.round(totals.weekly).toLocaleString('da-DK')} kr.</span>
                        </div>
                        <div className="pt-3 border-t border-line">
                          <div className="text-[10px] uppercase tracking-nav text-inkMute font-bold mb-2">Varenumre hos grossist</div>
                          <ul className="text-xs space-y-1">
                            {Object.values(selectedProducts).filter(Boolean).map(p => (
                              <li key={p.id} className="flex justify-between">
                                <span className="text-inkSoft">{p.name}</span>
                                <span className="font-mono text-ink">{p.vno}</span>
                              </li>
                            ))}
                          </ul>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                {/* TRIN 5 — Lead-formular eller låst-op indhold */}
                {!unlocked ? (
                  <div className="mt-8 rounded-2xl bg-cream border border-line p-6 sm:p-10">
                    <div className="grid lg:grid-cols-2 gap-8 items-start">
                      <div>
                        <p className="text-[11px] uppercase tracking-nav text-coral font-bold mb-2">Trin 4 af 4</p>
                        <h3 className="font-display text-3xl sm:text-4xl font-semibold text-ink leading-tight">
                          Lås op for præcise priser & varenumre
                        </h3>
                        <p className="text-inkSoft mt-3">
                          Indtast dine oplysninger for at se dine præcise portionspriser, totaløkonomi
                          samt varenumre til Hørkram, Dagrofa eller BC Catering.
                        </p>
                        <ul className="mt-5 text-sm space-y-2 text-ink/85">
                          <li className="flex gap-2"><span className="text-coral">✓</span> Portionspris pr. gæst</li>
                          <li className="flex gap-2"><span className="text-coral">✓</span> Interaktiv kuvert-beregner</li>
                          <li className="flex gap-2"><span className="text-coral">✓</span> Varenumre til din grossist</li>
                          <li className="flex gap-2"><span className="text-coral">✓</span> Downloadbar PDF til dit team</li>
                        </ul>
                      </div>

                      <form onSubmit={submitForm} className="bg-paper border border-line rounded-lg p-5 sm:p-6 shadow-card space-y-3">
                        <div>
                          <label className="text-[11px] uppercase tracking-nav font-bold text-inkSoft">Navn</label>
                          <input required value={form.name} onChange={e=>setForm({...form, name:e.target.value})}
                            className="mt-1.5 w-full rounded-md border border-line bg-bg/60 px-3 py-2.5 focus:outline-none focus:border-ink" placeholder="Fornavn Efternavn" />
                        </div>
                        <div>
                          <label className="text-[11px] uppercase tracking-nav font-bold text-inkSoft">E-mail</label>
                          <input required type="email" value={form.email} onChange={e=>setForm({...form, email:e.target.value})}
                            className="mt-1.5 w-full rounded-md border border-line bg-bg/60 px-3 py-2.5 focus:outline-none focus:border-ink" placeholder="navn@firma.dk" />
                        </div>
                        <div className="grid sm:grid-cols-2 gap-3">
                          <div>
                            <label className="text-[11px] uppercase tracking-nav font-bold text-inkSoft">Virksomhed</label>
                            <input required value={form.company} onChange={e=>setForm({...form, company:e.target.value})}
                              className="mt-1.5 w-full rounded-md border border-line bg-bg/60 px-3 py-2.5 focus:outline-none focus:border-ink" placeholder="F.eks. Café Nordlys" />
                          </div>
                          <div>
                            <label className="text-[11px] uppercase tracking-nav font-bold text-inkSoft">Køkkentype</label>
                            <select required value={form.kitchen} onChange={e=>setForm({...form, kitchen:e.target.value})}
                              className="mt-1.5 w-full rounded-md border border-line bg-bg/60 px-3 py-2.5 focus:outline-none focus:border-ink">
                              <option value="">Vælg…</option>
                              <option>Restaurant</option>
                              <option>Café / bar</option>
                              <option>Kantine</option>
                              <option>Hotel</option>
                              <option>Event / catering</option>
                            </select>
                          </div>
                        </div>
                        <div>
                          <label className="text-[11px] uppercase tracking-nav font-bold text-inkSoft">Hvilken grossist bruger du i dag?</label>
                          <select required value={form.wholesaler} onChange={e=>setForm({...form, wholesaler:e.target.value})}
                            className="mt-1.5 w-full rounded-md border border-line bg-bg/60 px-3 py-2.5 focus:outline-none focus:border-ink">
                            <option value="">Vælg grossist…</option>
                            <option>Hørkram</option>
                            <option>Dagrofa Foodservice</option>
                            <option>BC Catering</option>
                            <option>AB Catering</option>
                            <option>Andet</option>
                          </select>
                        </div>
                        <button type="submit"
                          className="w-full mt-2 px-5 py-3.5 rounded-full bg-coral text-paper font-semibold tracking-wide hover:bg-coralDk transition-all shadow-card hover:shadow-cardHover">
                          Lås priser & varenumre op
                        </button>
                        <p className="text-[11px] text-inkMute leading-relaxed">
                          Ved at indsende accepterer du, at Dencon Foods kontakter dig vedr. dit koncept.
                          Vi deler ikke dine oplysninger.
                        </p>
                      </form>
                    </div>
                  </div>
                ) : (
                  <div className="mt-8 rounded-2xl bg-paper border border-line p-6 sm:p-10 shadow-card fade-in">
                    <div className="flex items-start gap-3">
                      <div className="w-10 h-10 rounded-full bg-coral text-paper grid place-items-center font-bold">✓</div>
                      <div>
                        <h3 className="font-display text-3xl font-semibold text-ink">
                          Tak {form.name?.split(' ')[0] || ''} — dit koncept er låst op
                        </h3>
                        <p className="text-sm text-inkSoft mt-1">
                          Vi har også sendt en kopi til <strong className="text-ink">{form.email}</strong>. Justér gæsteantal for at se din ugeøkonomi.
                        </p>
                      </div>
                    </div>

                    <div className="mt-6 rounded-lg bg-cream border border-line p-5">
                      <div className="flex items-baseline justify-between flex-wrap gap-3">
                        <div>
                          <div className="text-[10px] uppercase tracking-nav text-coral font-bold">Kuvert-beregner</div>
                          <div className="font-display text-2xl font-semibold text-ink">{guests.toLocaleString('da-DK')} gæster pr. uge</div>
                        </div>
                        <div className="text-right">
                          <div className="text-[10px] uppercase tracking-nav text-inkMute">Ugentlig vareomkostning</div>
                          <div className="font-display text-3xl font-semibold text-ink">{Math.round(totals.weekly).toLocaleString('da-DK')} kr.</div>
                        </div>
                      </div>
                      <input
                        type="range" min="50" max="2000" step="10"
                        value={guests} onChange={e=>setGuests(parseInt(e.target.value))}
                        style={{'--p': `${sliderPct}%`}}
                        className="w-full mt-4"
                      />
                      <div className="flex justify-between text-[10px] uppercase tracking-nav text-inkMute mt-1">
                        <span>50</span><span>500</span><span>1000</span><span>2000</span>
                      </div>
                      <div className="grid sm:grid-cols-3 gap-3 mt-5">
                        <div className="rounded-md bg-paper border border-line p-3 text-center">
                          <div className="text-[10px] uppercase tracking-nav text-inkMute">Portionspris</div>
                          <div className="font-display font-semibold text-ink text-xl">{totals.pricePerPortion.toFixed(2)} kr.</div>
                        </div>
                        <div className="rounded-md bg-paper border border-line p-3 text-center">
                          <div className="text-[10px] uppercase tracking-nav text-inkMute">Pr. måned (4 uger)</div>
                          <div className="font-display font-semibold text-ink text-xl">{Math.round(totals.weekly*4).toLocaleString('da-DK')} kr.</div>
                        </div>
                        <div className="rounded-md bg-paper border border-line p-3 text-center">
                          <div className="text-[10px] uppercase tracking-nav text-inkMute">Pr. år (50 uger)</div>
                          <div className="font-display font-semibold text-ink text-xl">{Math.round(totals.weekly*50).toLocaleString('da-DK')} kr.</div>
                        </div>
                      </div>
                    </div>

                    <div className="grid sm:grid-cols-2 gap-3 mt-6">
                      <button onClick={() => window.print()}
                        className="px-5 py-3.5 rounded-full bg-coral text-paper font-semibold tracking-wide hover:bg-coralDk transition-all shadow-card hover:shadow-cardHover">
                        ⬇ Download PDF
                      </button>
                      <button onClick={resetAll}
                        className="px-5 py-3.5 rounded-full border border-ink text-ink font-semibold tracking-wide hover:bg-ink hover:text-paper transition-all">
                        Byg et nyt koncept
                      </button>
                    </div>
                  </div>
                )}

                <div className="mt-8">
                  <button onClick={() => setStep(3)} className="text-sm text-inkSoft hover:text-coral">← Tilbage og justér tallerken</button>
                </div>
              </section>
            )}
          </main>

          <DenconFooter />

          {/* Dencon's "scroll-top" koral-knap (matcher screenshot) */}
          <button onClick={() => window.scrollTo({top:0,behavior:'smooth'})}
            aria-label="Til toppen"
            className="fixed bottom-6 right-6 w-12 h-12 rounded-md dencon-pill grid place-items-center shadow-cardHover text-xl">
            ↑
          </button>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
