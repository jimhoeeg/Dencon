    /* ============================================================
       CVR-validering — Modulus-11 efter dansk CVR-standard.
       Vægte: 2,7,6,5,4,3,2,1. Sum mod 11 == 0 → gyldigt.
       ============================================================ */
    function normalizeCVR(s) { return (s||'').replace(/\D/g,'').slice(0,8); }
    function validateCVR(s) {
      const d = normalizeCVR(s);
      if (d.length !== 8) return false;
      const w = [2,7,6,5,4,3,2,1];
      let sum = 0;
      for (let i = 0; i < 8; i++) sum += parseInt(d[i],10) * w[i];
      return sum % 11 === 0;
    }

    /* ============================================================
       AI-lignende product-matcher: scorer alle produkter baseret
       på keywords i brugerens kommentar og returnerer de 3 bedste
       der IKKE allerede er valgt. Placeholder for en rigtig LLM.
       ============================================================ */
    function suggestExtraProducts(comment, situationKey, alreadyPickedIds) {
      const text = (comment||'').toLowerCase();
      const allLists = ['protein','base','topping']
        .flatMap(cat => PRODUCTS[cat][situationKey] || []);
      const scored = allLists
        .filter(p => !alreadyPickedIds.has(p.id))
        .map(p => {
          let score = 0;
          (p.keywords||[]).forEach(k => { if (text.includes(k.toLowerCase())) score += 3; });
          // bonus hvis kommentaren nævner generelle temaer
          if (/klima|bæredygt|co2|grøn/.test(text) && p.co2Reduction > 40) score += 2;
          if (/hurtig|travl|stress|tempo/.test(text) && p.prepMinutes <= 3) score += 2;
          if (/premium|gourmet|fest|fine|luksus/.test(text) && p.tags?.includes('premium')) score += 2;
          if (/børn|kid|fastfood/.test(text) && p.tags?.includes('value')) score += 1;
          return { p, score };
        })
        .sort((a,b) => b.score - a.score);
      // returnér op til 3 — og hvis ingen scorer, vælg 3 tilfældige som "fall-back"
      const top = scored.filter(s => s.score > 0).slice(0,3).map(s => s.p);
      if (top.length >= 1) return top;
      return scored.slice(0,3).map(s => s.p);
    }

          {steps.map((label, i) => {
            const idx = i + 1;
            const done = step > idx;
            const active = step === idx;
            return (
              <li key={label} className="flex-1 flex items-center gap-2 min-w-0">
                <div className={`shrink-0 w-7 h-7 rounded-full flex items-center justify-center text-[12px] font-bold border transition-all
                  ${done ? 'bg-coral text-paper border-coral' :
                    active ? 'bg-paper text-ink border-ink' :
                            'bg-paper text-inkMute border-line'}`}>
                  {done ? '✓' : idx}
                </div>
                <span className={`truncate text-[10px] sm:text-xs font-bold tracking-nav uppercase
                  ${active ? 'text-ink' : done ? 'text-coral' : 'text-inkMute'}`}>{label}</span>
                {i < steps.length - 1 && (
                  <div className={`hidden sm:block h-px flex-1 ${done ? 'bg-coral' : 'bg-line'}`} />
                )}
              </li>
            );
          })}
        </ol>
      );
    }

    function filterByProfile(list, profileId) {
      const filtered = list.filter(p => p.tags?.includes(profileId));
      return filtered.length ? filtered : list;
    }

    /* ============================================================
       Hovedkomponent
       ============================================================ */
    function App() {
      const [step, setStep] = useState(1);
      const [situation, setSituation] = useState(null);
      const [profile, setProfile] = useState(null);

      // FLERE TALLERKENER — array af { id, name, picks }
      const blankPlate = () => ({ id: crypto.randomUUID(), picks: { protein:null, base:null, topping:null } });
      const [plates, setPlates] = useState([{ ...blankPlate(), name: "Tallerken 1" }]);
      const [activePlate, setActivePlate] = useState(0);
      const [lastTouched, setLastTouched] = useState(null);

      // Kommentar fra Trin 4 (AI input)
      const [comment, setComment] = useState('');

      // Lead-form + CVR-validering
      const [unlocked, setUnlocked] = useState(false);
      const [form, setForm] = useState({ name:'', email:'', company:'', kitchen:'', wholesaler:'', cvr:'' });
      const [cvrError, setCvrError] = useState('');

      const [guests, setGuests] = useState(250);

      const situationObj = SITUATIONS.find(s => s.id === situation);
      const lists = useMemo(() => {
        if (!situationObj || !profile) return { protein: [], base: [], topping: [] };
        const key = situationObj.productKey;
        return {
          protein: filterByProfile(PRODUCTS.protein[key],  profile),
          base:    filterByProfile(PRODUCTS.base[key],     profile),
          topping: filterByProfile(PRODUCTS.topping[key],  profile),
        };
      }, [situationObj, profile]);

      const plate = plates[activePlate];
      const picks = plate?.picks || { protein:null, base:null, topping:null };

      const selectedProducts = useMemo(() => ({
        protein: lists.protein.find(p => p.id === picks.protein) || null,
        base:    lists.base.find(p => p.id === picks.base)       || null,
        topping: lists.topping.find(p => p.id === picks.topping) || null,
      }), [lists, picks]);

      const lastTouchedItem = lastTouched ? selectedProducts[lastTouched] : null;
      const plateComplete = !!(picks.protein && picks.base && picks.topping);
      const allPlatesComplete = plates.every(pl => pl.picks.protein && pl.picks.base && pl.picks.topping);

      // Totalvurdering på tværs af alle tallerkener (til Trin 5)
      const totals = useMemo(() => {
        const platesResolved = plates.map(pl => {
          const items = [
            lists.protein.find(p => p.id === pl.picks.protein),
            lists.base.find(p => p.id === pl.picks.base),
            lists.topping.find(p => p.id === pl.picks.topping),
          ].filter(Boolean);
          const portion = items.reduce((s,x) => s + x.pricePerPortion, 0);
          const prep    = items.length ? Math.max(...items.map(x => x.prepMinutes)) : 0;
          const co2     = items.length ? Math.round(items.reduce((s,x)=>s+x.co2Reduction,0)/items.length) : 0;
          return { plate: pl, items, portion, prep, co2 };
        });
        // Hvis flere tallerkener: gennemsnitlig portionspris, max prep, gennemsnit CO₂
        const avgPortion = platesResolved.length
          ? platesResolved.reduce((s,x) => s + x.portion, 0) / platesResolved.length
          : 0;
        const maxPrep = platesResolved.length ? Math.max(...platesResolved.map(x => x.prep)) : 0;
        const avgCO2  = platesResolved.length
          ? Math.round(platesResolved.reduce((s,x) => s + x.co2, 0) / platesResolved.length)
          : 0;
        const weekly = avgPortion * guests;
        return { platesResolved, avgPortion, maxPrep, avgCO2, weekly };
      }, [plates, lists, guests]);

      // AI-forslag baseret på kommentar
      const aiExtras = useMemo(() => {
        if (!situationObj) return [];
        const pickedIds = new Set();
        plates.forEach(pl => Object.values(pl.picks).forEach(id => id && pickedIds.add(id)));
        return suggestExtraProducts(comment, situationObj.productKey, pickedIds);
      }, [comment, plates, situationObj]);

      // Vores ekstra forslag (3 tips)
      const conceptTips = useMemo(
        () => pickTips(situation, profile, comment),
        [situation, profile, comment]
      );

      function setPickInActivePlate(type, id) {
        setPlates(prev => prev.map((pl, i) =>
          i !== activePlate ? pl : { ...pl, picks: { ...pl.picks, [type]: id } }
        ));
        setLastTouched(type);
      }

      function addPlate() {
        setPlates(prev => {
          const next = [...prev, { ...blankPlate(), name: `Tallerken ${prev.length + 1}` }];
          setActivePlate(next.length - 1);
          return next;
        });
        setLastTouched(null);
      }

      function removePlate(idx) {
        if (plates.length === 1) return;
        setPlates(prev => prev.filter((_,i) => i !== idx).map((pl,i) => ({...pl, name: `Tallerken ${i+1}`})));
        setActivePlate(0);
      }

      function resetAll() {
        setStep(1); setSituation(null); setProfile(null);
        setPlates([{ ...blankPlate(), name: "Tallerken 1" }]);
        setActivePlate(0);
        setLastTouched(null); setUnlocked(false);
        setComment('');
        setForm({ name:'', email:'', company:'', kitchen:'', wholesaler:'', cvr:'' });
        setCvrError('');
        setGuests(250);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function submitForm(e) {
        e.preventDefault();
        // CVR-validering: format + mod-11 checksum. Kun gyldige numre låser op.
        const cvr = normalizeCVR(form.cvr);
        if (!validateCVR(cvr)) {
          setCvrError("Ugyldigt CVR — angiv 8 cifre fra et registreret dansk firma.");
          return;
        }
        setCvrError('');
        // Simuleret lead-submit. Skift til rigtigt API-kald:
        // fetch('/api/leads', { method:'POST', body: JSON.stringify({...form, cvr}) })
        setUnlocked(true);
      }

      useEffect(() => { window.scrollTo({ top: 0, behavior: 'smooth' }); }, [step]);

      const sliderPct = Math.round(((guests - 50) / (2000 - 50)) * 100);

      function CTA({ children, disabled, ...rest }) {
        return (
          <button {...rest} disabled={disabled}
            className={`px-7 py-3.5 rounded-full font-semibold text-[14px] tracking-wide transition-all
              ${disabled ? 'bg-line text-inkMute cursor-not-allowed'
                         : 'bg-coral text-paper hover:bg-coralDk shadow-card hover:shadow-cardHover'}`}>
            {children}
          </button>
        );
      }

      return (
        <div className="min-h-screen bg-bg">
          <DenconHeader onReset={resetAll} />

          {/* Hero — kun på Trin 1 */}
          {step === 1 && (
            <section className="bg-cream">
              <div className="max-w-6xl mx-auto px-4 sm:px-6 py-14 sm:py-20 grid md:grid-cols-2 gap-10 items-center">

                    Byg dit<br/>næste<br/>menukoncept.
                  </h1>
                  <p className="text-inkSoft text-lg mt-6 max-w-md">
                    Vi guider dig fra spisesituation til færdigt koncept med Dencon-produkter — på under 3 minutter.
                  </p>
                </div>
                <div className="hidden md:block">

                    <div className="text-[11px] uppercase tracking-nav text-cream/60 mb-3">Sådan virker det</div>
                    <ol className="space-y-3 text-cream text-[15px]">
                      <li className="flex gap-3"><span className="font-display text-coral text-xl leading-none">1.</span>Vælg spisesituation</li>
                      <li className="flex gap-3"><span className="font-display text-coral text-xl leading-none">2.</span>Vælg profil & ambition</li>
                      <li className="flex gap-3"><span className="font-display text-coral text-xl leading-none">3.</span>Byg én eller flere tallerkener</li>
                      <li className="flex gap-3"><span className="font-display text-coral text-xl leading-none">4.</span>Fortæl os om din madoplevelse</li>
                      <li className="flex gap-3"><span className="font-display text-coral text-xl leading-none">5.</span>Lås op med dit CVR & se prisen</li>
                    </ol>
                  </div>
                </div>
              </div>
            </section>
          )}

          {/* Statusbar */}
          <div className="bg-paper border-y border-line/60 sticky top-0 z-10">
            <div className="max-w-6xl mx-auto px-4 sm:px-6 py-3">
              <StatusBar step={step} />
            </div>
          </div>

          <main className="max-w-6xl mx-auto px-4 sm:px-6 py-10 sm:py-14">

            {/* ========================= TRIN 1 ========================= */}
            {step === 1 && (
              <section className="fade-in">
                <div className="max-w-2xl">
                  <p className="text-[11px] uppercase tracking-nav text-coral font-bold mb-2">Trin 1 af 5</p>
                  <h2 className="font-display text-4xl sm:text-5xl font-semibold text-ink leading-tight">Hvilken spisesituation løser vi for dig?</h2>
                  <p className="text-inkSoft mt-3">Vælg den situation der bedst beskriver dit køkken — vi skræddersyer derefter et færdigt koncept.</p>
                </div>
                <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-4 mt-10">
                  {SITUATIONS.map(s =>
                    <SituationCard key={s.id} s={s} selected={situation===s.id} onClick={() => setSituation(s.id)} />
                  )}
                </div>

                {/* Central videns-highlight på Trin 1 */}
                <div className="mt-10">
                  <InsightBox
                    tone="ink"
                    label="Branche-indsigt"
                    stat={{ value:"47%", label:"Lavere svind" }}
                    title="Færdigtilberedte koncepter sænker dit madsvind drastisk"
                    body="Danske foodservice-køkkener der skifter til færdige komponenter rapporterer i gennemsnit 47% lavere madsvind og 22% kortere service-tid."
                    details={
                      <>
                        <p>Tallet bygger på data fra Dencon's egne kundekøkkener i perioden 2023–2025 — på tværs af kantiner, hoteller og caféer.</p>
                        <p>De største gevinster ses i kategorierne <strong className="text-paper">protein</strong> (færdigstegte bøffer & sous-vide kylling) og <strong className="text-paper">brød</strong> (frostkonserverede buns med 100% holdbarhed).</p>
                      </>
                    }
                  />
                </div>

                <div className="mt-10 flex justify-end">
                  <CTA disabled={!situation} onClick={() => setStep(2)}>Fortsæt →</CTA>
                </div>
              </section>
            )}

            {/* ========================= TRIN 2 ========================= */}
            {step === 2 && (
              <section className="fade-in">
                <div className="max-w-2xl">
                  <p className="text-[11px] uppercase tracking-nav text-coral font-bold mb-2">Trin 2 af 5</p>
                  <h2 className="font-display text-4xl sm:text-5xl font-semibold text-ink leading-tight">Hvad er dit primære fokus?</h2>
                  <p className="text-inkSoft mt-3">Profilen styrer hvilke produkter vi anbefaler i næste trin — fra økonomi til premium til klima.</p>
                </div>
                <div className="grid sm:grid-cols-3 gap-4 mt-10">
                  {PROFILES.map(p =>
                    <ProfileCard key={p.id} p={p} selected={profile===p.id} onClick={() => setProfile(p.id)} />
                  )}
                </div>

                <div className="mt-10">
                  <InsightBox
                    tone="cream"
                    label="Tip"
                    stat={{ value:"+18%", label:"Snitpris" }}
                    title="Premium-profilen hæver din snitpris med op til 18%"
                    body="Køkkener der aktivt fortæller historien om brand og oprindelse (fx 'Black Angus, 28 dages modning') ser markant højere gæste-villighed til at betale mere."
                    details={
                      <>
                        <p>Den grønne profil rammer den voksende gruppe af 'flexitarer' (38% af danskere ifølge Coop Analyse 2025). En enkelt plantebaseret variant er nok til at åbne segmentet.</p>
                        <p>Value-profilen er optimal til kantiner og fastfood, hvor kalkulen pr. portion er afgørende.</p>
                      </>
                    }
                  />
                </div>

                <div className="mt-10 flex items-center justify-between">
                  <button onClick={() => setStep(1)} className="text-sm text-inkSoft hover:text-coral">← Tilbage</button>
                  <CTA disabled={!profile} onClick={() => setStep(3)}>Fortsæt →</CTA>
                </div>
              </section>
            )}

            {/* ========================= TRIN 3 — MULTI-TALLERKEN ========================= */}
            {step === 3 && (
              <section className="fade-in">
                <div className="max-w-2xl">
                  <p className="text-[11px] uppercase tracking-nav text-coral font-bold mb-2">Trin 3 af 5</p>
                  <h2 className="font-display text-4xl sm:text-5xl font-semibold text-ink leading-tight">Byg dine tallerkener</h2>
                  <p className="text-inkSoft mt-3">Sammensæt så mange varianter du vil — fx en kødvariant + en plantebaseret variant til samme menu. For hvert valg lærer du noget om produktet.</p>
                </div>

                {/* Tab-bar med tallerkener */}
                <div className="mt-8 flex flex-wrap items-center gap-2">
                  {plates.map((pl, i) => {
                    const done = pl.picks.protein && pl.picks.base && pl.picks.topping;
                    const isActive = i === activePlate;
                    return (
                      <div key={pl.id} className="flex items-center">
                        <button onClick={() => { setActivePlate(i); setLastTouched(null); }}
                          className={`pl-4 pr-3 py-2 rounded-l-full text-[13px] font-semibold tracking-wide flex items-center gap-2 border transition-all
                            ${isActive ? 'bg-ink text-paper border-ink' : 'bg-paper text-ink border-line hover:border-ink/30'}`}>
                          <span>{pl.name}</span>
                          <span className={`text-[10px] uppercase tracking-nav font-bold ${isActive ? 'text-coral' : (done ? 'text-coral' : 'text-inkMute')}`}>
                            {done ? '✓' : `${[pl.picks.protein,pl.picks.base,pl.picks.topping].filter(Boolean).length}/3`}
                          </span>
                        </button>
                        {plates.length > 1 && (
                          <button onClick={() => removePlate(i)} title="Fjern tallerken"
                            className={`px-2 py-2 rounded-r-full border-y border-r text-inkMute hover:text-coral transition-colors
                              ${isActive ? 'bg-ink border-ink text-cream/70' : 'bg-paper border-line'}`}>
                            <Icon.trash className="w-4 h-4"/>
                          </button>
                        )}
                        {plates.length === 1 && (
                          <div className={`px-2 py-2 rounded-r-full border-y border-r ${isActive?'bg-ink border-ink':'bg-paper border-line'}`}>
                            <Icon.trash className="w-4 h-4 text-inkMute/30"/>
                          </div>
                        )}
                      </div>
                    );
                  })}
                  <button onClick={addPlate}
                    className="ml-1 inline-flex items-center gap-1.5 px-4 py-2 rounded-full border-2 border-dashed border-coral/60 text-coral text-[13px] font-semibold tracking-wide hover:bg-coralBg transition-colors">
                    <Icon.plus className="w-4 h-4"/> Tilføj tallerken
                  </button>
                </div>

                <div className="grid lg:grid-cols-3 gap-6 mt-8">
                  <div className="lg:col-span-2 space-y-8">
                    {[
                      { key:'protein', label:'1 — Protein',     items: lists.protein },
                      { key:'base',    label:'2 — Brød / Bund', items: lists.base    },
                      { key:'topping', label:'3 — Topping',     items: lists.topping },
                    ].map(group => (
                      <div key={group.key}>
                        <div className="flex items-baseline justify-between mb-3">
                          <h3 className="font-display text-2xl font-semibold text-ink">{group.label}</h3>
                          {picks[group.key] && <span className="text-[11px] uppercase tracking-nav text-coral font-bold">✓ Valgt</span>}
                        </div>
                        <div className="grid gap-3">
                          {group.items.map(item => (
                            <IngredientButton
                              key={item.id}
                              item={item}
                              selected={picks[group.key] === item.id}
                              onClick={() => setPickInActivePlate(group.key, item.id)}
                            />
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>

                  <aside className="lg:sticky lg:top-24 self-start space-y-4">
                    <KnowledgeBox item={lastTouchedItem} />

                    <div className="rounded-lg border border-line bg-paper p-5 shadow-card">
                      <div className="text-[11px] uppercase tracking-nav text-inkMute font-bold mb-3">
                        {plate?.name || 'Aktiv tallerken'}
                      </div>
                      <ul className="text-sm space-y-2">
                        {['protein','base','topping'].map(k => (
                          <li key={k} className="flex items-center justify-between gap-2">
                            <span className="text-inkMute">{k === 'base' ? 'Bund' : k === 'protein' ? 'Protein' : 'Topping'}</span>
                            <span className={`text-right font-medium ${selectedProducts[k] ? 'text-ink' : 'text-inkMute/60'}`}>
                              {selectedProducts[k]?.name || '— ikke valgt'}
                            </span>
                          </li>
                        ))}
                      </ul>
                      {plates.length > 1 && (
                        <div className="mt-4 pt-3 border-t border-line text-[12px] text-inkMute">
                          Du bygger {plates.length} tallerkener — totalt {plates.filter(pl => pl.picks.protein && pl.picks.base && pl.picks.topping).length}/{plates.length} færdige.
                        </div>
                      )}
                    </div>

                    <InsightBox
                      tone="sun"
                      label="Hvorfor flere tallerkener?"
                      title="Giv gæsten et reelt valg"
                      body="Køkkener med 2-3 varianter på samme koncept rapporterer 26% højere gentagende besøg — kunden vender tilbage for at prøve den næste."
                      details={
                        <p>Et godt mix er fx én kød-variant + én plantebaseret + én sæson-variant. Du bruger samme 'mor-bygning' i køkkenet og maksimerer dækningsbidraget.</p>
                      }
                    />
                  </aside>
                </div>

                <div className="mt-10 flex items-center justify-between">
                  <button onClick={() => setStep(2)} className="text-sm text-inkSoft hover:text-coral">← Tilbage</button>
                  <CTA disabled={!allPlatesComplete} onClick={() => setStep(4)}>
                    {allPlatesComplete ? 'Næste: Detaljer →' : 'Færdiggør alle tallerkener'}
                  </CTA>
                </div>
              </section>
            )}

            {/* ========================= TRIN 4 — KOMMENTAR ========================= */}
            {step === 4 && (
              <section className="fade-in">
                <div className="max-w-2xl">
                  <p className="text-[11px] uppercase tracking-nav text-coral font-bold mb-2">Trin 4 af 5</p>
                  <h2 className="font-display text-4xl sm:text-5xl font-semibold text-ink leading-tight">Fortæl os om din madoplevelse</h2>
                  <p className="text-inkSoft mt-3">Vores AI bruger din beskrivelse til at matche flere relevante produkter fra Dencons sortiment og skræddersy de tips, du får på næste side.</p>
                </div>

                <div className="grid lg:grid-cols-3 gap-6 mt-10">
                  <div className="lg:col-span-2">
                    <label className="block text-[11px] uppercase tracking-nav font-bold text-inkSoft mb-2">Beskriv din madoplevelse</label>
                    <textarea
                      value={comment}
                      onChange={e => setComment(e.target.value)}
                      rows={9}
                      placeholder="Fx: 'Vi vil gerne lave en hyggelig fredagsmenu til 200 gæster med fokus på bæredygtighed. Der skal være mulighed for vegansk variant, og det skal kunne klares hurtigt af 2 i køkkenet. Drinks-pairing er vigtigt.'"
                      className="w-full rounded-lg border border-line bg-paper px-4 py-3 text-[15px] focus:outline-none focus:border-ink shadow-card"
                    />
                    <div className="flex items-center justify-between mt-2 text-[12px] text-inkMute">
                      <span>{comment.length} tegn — gerne 2-3 sætninger</span>
                      <span>Vælg gerne ord som: <em>klima, hurtig, premium, børn, drink, sæson</em></span>
                    </div>

                    <div className="mt-8">
                      <InsightBox
                        tone="coral"
                        label="Sådan hjælper AI dig"
                        title="Vi matcher dine ord mod hele Dencons sortiment"
                        body="AI'en analyserer din beskrivelse for nøgleord (sæson, tempo, klima, drinks, allergier...) og foreslår 3 ekstra produkter du måske ikke har valgt — plus 3 skræddersyede tips på næste side."
                        details={
                          <>
                            <p>Eksempler på hvad AI'en fanger:</p>
                            <ul className="list-disc ml-5 space-y-1">
                              <li>"vinter" → varme suppe-shots og Bone Broth</li>
                              <li>"børn" → mini-portion vejledning og crowd-pleasers</li>
                              <li>"klima" → CO₂-fokus og plantebaserede alternativer</li>
                              <li>"travl/hurtig" → produkter med ≤3 min. tilberedning</li>
                            </ul>
                            <p className="text-[11px] uppercase tracking-nav text-inkMute pt-2">Dine ord deles ikke med tredjepart.</p>
                          </>
                        }
                      />
                    </div>

                  <aside className="space-y-4">
                    <div className="rounded-lg border border-line bg-paper p-5 shadow-card">

                      label="Tip"

                  <div className="absolute -right-6 -top-6 opacity-10 text-coral">
                    {situationObj?.Icon && <situationObj.Icon className="w-[260px] h-[260px]"/>}
                  </div>
                  <p className="text-[11px] uppercase tracking-nav text-coral font-bold mb-3">Dit Dencon-koncept</p>
                  <h2 className="font-display text-4xl sm:text-6xl font-semibold leading-[1.02]">
                    {makeConceptName(situation, profile)}
                  </h2>
                  <p className="mt-4 text-cream/80 max-w-2xl">
                    {plates.length === 1 ? 'En tallerken' : `${plates.length} tallerkener`} skræddersyet til {situationObj?.title.toLowerCase()} med profilen <strong className="text-paper">{PROFILES.find(p=>p.id===profile)?.title}</strong>.
                  </p>
                  <div className="grid sm:grid-cols-3 gap-3 mt-7 relative z-10">
                    <div className="rounded-lg bg-paper/10 border border-paper/10 backdrop-blur p-4">
                      <div className="text-[10px] uppercase tracking-nav text-cream/60">Klar på</div>
                      <div className="font-display text-3xl font-semibold mt-1">{totals.maxPrep} min</div>
                      <div className="text-xs text-cream/60">længste komponent</div>
                    </div>
                    <div className="rounded-lg bg-paper/10 border border-paper/10 backdrop-blur p-4">
                      <div className="text-[10px] uppercase tracking-nav text-cream/60">CO₂-reduktion</div>
                      <div className="font-display text-3xl font-semibold mt-1">−{totals.avgCO2}%</div>
                      <div className="text-xs text-cream/60">gns. pr. komponent</div>
                    </div>
                    <div className="rounded-lg bg-paper/10 border border-paper/10 backdrop-blur p-4">
                      <div className="text-[10px] uppercase tracking-nav text-cream/60">Svind</div>
                      <div className="font-display text-3xl font-semibold mt-1">~0%</div>
                      <div className="text-xs text-cream/60">færdigtilberedte komponenter</div>
                    </div>
                  </div>
                </div>

                {/* Ingredienser pr. tallerken + pris-sektion */}
                <div className="grid lg:grid-cols-3 gap-6 mt-8">
                  <div className="lg:col-span-2 space-y-4">
                    {totals.platesResolved.map((pr, i) => (
                      <div key={pr.plate.id} className="rounded-lg bg-paper border border-line p-6 shadow-card">
                        <div className="flex items-baseline justify-between mb-3">
                          <h3 className="font-display text-2xl font-semibold text-ink">{pr.plate.name}</h3>
                          <span className="text-[11px] uppercase tracking-nav text-inkMute">⏱ {pr.prep} min · −{pr.co2}% CO₂</span>
                        </div>
                        <ul className="divide-y divide-line">
                          {pr.items.map(item => (
                            <li key={item.id} className="py-3 flex items-start gap-3">
                              <div className="text-2xl">{item.icon}</div>
                              <div className="flex-1">
                                <div className="font-semibold text-ink">{item.name}</div>
                                <div className="text-xs text-inkSoft mt-0.5">{item.brand} · klar på {item.prepMinutes} min.</div>
                              </div>
                            </li>
                          ))}
                        </ul>
                      </div>
                    ))}

                    <div className="rounded-lg bg-cream border border-line p-5">
                      <div className="text-[10px] uppercase tracking-nav text-coral font-bold mb-1">Køkkenvejledning</div>
                      <p className="text-sm text-ink/85">
                        Klar på <strong>{totals.maxPrep} minutter</strong> i konvektovn ved 180°C.
                        Anret protein på bund, top med valgt topping og servér straks. Alle komponenter
                        er færdigtilberedte — minimal håndtering, maksimal hastighed.
                      </p>
                    </div>
                  </div>

                  {/* Pris-sektion (sløret indtil CVR er valideret) */}
                  <div className="relative rounded-lg bg-paper border border-line p-6 shadow-card">
                    {!unlocked && (
                      <div className="absolute inset-0 rounded-lg bg-paper/80 backdrop-blur-[2px] z-10 flex flex-col items-center justify-center text-center p-6">
                        <div className="w-12 h-12 rounded-full bg-coral text-paper grid place-items-center">
                          <Icon.lock className="w-6 h-6"/>
                        </div>
                        <div className="mt-3 font-display text-xl font-semibold text-ink">Priser låst</div>
                        <div className="text-xs text-inkSoft mt-1 max-w-[18rem]">Validér dit CVR nedenfor for at se portionspriser, varenumre og ugeøkonomi.</div>
                      </div>
                    )}

                    <h3 className="font-display text-2xl font-semibold text-ink">Økonomi & priser</h3>
                    <div className={!unlocked ? "blurred mt-4" : "mt-4"}>
                      <div className="space-y-3">
                        <div className="flex items-baseline justify-between">
                          <span className="text-sm text-inkSoft">{plates.length === 1 ? 'Portionspris' : 'Gns. portionspris'}</span>
                          <span className="font-display font-semibold text-ink text-xl">{totals.avgPortion.toFixed(2)} kr.</span>
                        </div>
                        <div className="flex items-baseline justify-between">
                          <span className="text-sm text-inkSoft">Pr. uge ({guests} gæster)</span>
                          <span className="font-display font-semibold text-ink text-xl">{Math.round(totals.weekly).toLocaleString('da-DK')} kr.</span>
                        </div>
                        <div className="pt-3 border-t border-line">
                          <div className="text-[10px] uppercase tracking-nav text-inkMute font-bold mb-2">Varenumre hos grossist</div>
                          <ul className="text-xs space-y-1">
                            {totals.platesResolved.flatMap(pr => pr.items).filter((v,i,a) => a.findIndex(x=>x.id===v.id)===i).map(p => (
                              <li key={p.id} className="flex justify-between">
                                <span className="text-inkSoft truncate pr-2">{p.name}</span>
                                <span className="font-mono text-ink">{p.vno}</span>
                              </li>
                            ))}
                          </ul>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                {/* AI: ekstra produkt-forslag (vises altid) */}
                {aiExtras.length > 0 && (
                  <div className="mt-10">
                    <div className="flex items-center gap-2 mb-4">
                      <Icon.sparkle className="w-5 h-5 text-coral"/>
                      <h3 className="font-display text-3xl font-semibold text-ink">AI-forslag baseret på dine ord</h3>
                    </div>
                    <p className="text-inkSoft max-w-2xl mb-5">
                      Disse 3 produkter matcher det, du beskrev — og kunne gøre dit koncept stærkere.
                    </p>
                    <div className="grid sm:grid-cols-3 gap-4">
                      {aiExtras.map(p => (
                        <div key={p.id} className="rounded-lg border border-line bg-paper p-5 shadow-card slide-in">
                          <div className="flex items-start gap-3">
                            <div className="text-2xl">{p.icon}</div>
                            <div className="flex-1 min-w-0">
                              <div className="font-semibold text-ink">{p.name}</div>
                              <div className="text-[10px] uppercase tracking-nav text-inkMute mt-0.5">{p.brand}</div>
                            </div>
                          </div>
                          <p className="text-[13px] text-inkSoft mt-3 leading-relaxed">{p.fact}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* VORES EKSTRA FORSLAG — 3 tips */}
                <div className="mt-12 rounded-2xl bg-cream border border-line p-6 sm:p-10">
                  <div className="flex items-center gap-2 mb-2">
                    <Icon.sparkle className="w-5 h-5 text-coral"/>
                    <p className="text-[11px] uppercase tracking-nav text-coral font-bold">Vores ekstra forslag</p>
                  </div>
                  <h3 className="font-display text-3xl sm:text-4xl font-semibold text-ink leading-tight">Tre tips til at løfte dit koncept</h3>
                  <p className="text-inkSoft mt-3 max-w-2xl">
                    Tre konkrete forslag fra Dencon's foodservice-team — udvalgt på baggrund af dine valg og din beskrivelse.
                  </p>
                  <div className="grid md:grid-cols-3 gap-4 mt-7">
                    {conceptTips.map((tip, i) => (
                      <div key={tip.id} className="rounded-lg bg-paper border border-line p-5 shadow-card">
                        <div className="font-display text-4xl font-bold text-coral leading-none">{String(i+1).padStart(2,'0')}</div>
                        <h4 className="font-display text-xl font-semibold text-ink mt-3">{tip.title}</h4>
                        <p className="text-[14px] text-inkSoft mt-2 leading-relaxed">{tip.body}</p>
                      </div>
                    ))}
                  </div>
                </div>

                {/* CVR-LEAD-FORMULAR eller LÅST-OP indhold */}
                {!unlocked ? (
                  <div className="mt-12 rounded-2xl bg-paper border border-line p-6 sm:p-10 shadow-card">
                    <div className="grid lg:grid-cols-2 gap-8 items-start">
                      <div>
                        <p className="text-[11px] uppercase tracking-nav text-coral font-bold mb-2">Trin 5 af 5</p>
                        <h3 className="font-display text-3xl sm:text-4xl font-semibold text-ink leading-tight">
                          Lås op med dit CVR
                        </h3>
                        <p className="text-inkSoft mt-3">
                          Indtast dit danske CVR-nummer for at se dine præcise portionspriser, totaløkonomi
                          samt varenumre til Hørkram, Dagrofa eller BC Catering.
                        </p>
                        <ul className="mt-5 text-sm space-y-2 text-ink/85">
                          <li className="flex gap-2"><span className="text-coral">✓</span> Vi validerer dit CVR med dansk Modulus-11 algoritme</li>
                          <li className="flex gap-2"><span className="text-coral">✓</span> Kun gyldige CVR-numre giver adgang til B2B-priser</li>
                          <li className="flex gap-2"><span className="text-coral">✓</span> Interaktiv kuvert-beregner</li>
                          <li className="flex gap-2"><span className="text-coral">✓</span> Downloadbar PDF til dit team</li>
                        </ul>
                        <div className="mt-6">
                          <InsightBox
                            tone="sun"
                            label="Hvorfor CVR?"
                            title="B2B-priser kun til registrerede virksomheder"
                            body="Dencon Foods er en ren foodservice-grossist. Vi sælger ikke til private — og priserne du ser er nettopriser hos din grossist."
                          />
                        </div>
                      </div>

                      <form onSubmit={submitForm} className="bg-cream border border-line rounded-lg p-5 sm:p-6 shadow-card space-y-3">
                        <div>
                          <label className="text-[11px] uppercase tracking-nav font-bold text-inkSoft">Navn</label>
                          <input required value={form.name} onChange={e=>setForm({...form, name:e.target.value})}
                            className="mt-1.5 w-full rounded-md border border-line bg-paper px-3 py-2.5 focus:outline-none focus:border-ink" placeholder="Fornavn Efternavn" />
                        </div>
                        <div>
                          <label className="text-[11px] uppercase tracking-nav font-bold text-inkSoft">E-mail</label>
                          <input required type="email" value={form.email} onChange={e=>setForm({...form, email:e.target.value})}
                            className="mt-1.5 w-full rounded-md border border-line bg-paper px-3 py-2.5 focus:outline-none focus:border-ink" placeholder="navn@firma.dk" />
                        </div>
                        <div className="grid sm:grid-cols-2 gap-3">
                          <div>
                            <label className="text-[11px] uppercase tracking-nav font-bold text-inkSoft">Virksomhed</label>
                            <input required value={form.company} onChange={e=>setForm({...form, company:e.target.value})}
                              className="mt-1.5 w-full rounded-md border border-line bg-paper px-3 py-2.5 focus:outline-none focus:border-ink" placeholder="F.eks. Café Nordlys" />
                          </div>
                          <div>
                            <label className="text-[11px] uppercase tracking-nav font-bold text-inkSoft">Køkkentype</label>
                            <select required value={form.kitchen} onChange={e=>setForm({...form, kitchen:e.target.value})}
                              className="mt-1.5 w-full rounded-md border border-line bg-paper px-3 py-2.5 focus:outline-none focus:border-ink">
                              <option value="">Vælg…</option>
                              <option>Restaurant</option>
                              <option>Café / bar</option>
                              <option>Kantine</option>
                              <option>Hotel</option>
                              <option>Event / catering</option>
                            </select>
                          </div>
                        </div>
                        <div>
                          <label className="text-[11px] uppercase tracking-nav font-bold text-inkSoft">CVR-nummer</label>
                          <input required value={form.cvr}
                            onChange={e => { setForm({...form, cvr: normalizeCVR(e.target.value)}); setCvrError(''); }}
                            inputMode="numeric" pattern="\d{8}" maxLength={8}
                            className={`mt-1.5 w-full rounded-md border bg-paper px-3 py-2.5 font-mono tracking-widest focus:outline-none
                              ${cvrError ? 'border-coral focus:border-coral' : 'border-line focus:border-ink'}`}
                            placeholder="8 cifre, fx 17612492" />
                          {cvrError
                            ? <p className="mt-1.5 text-[12px] text-coral font-semibold">{cvrError}</p>
                            : <p className="mt-1.5 text-[12px] text-inkMute">Valideres med dansk Modulus-11 — kun gyldige CVR-numre låser op.</p>}
                        </div>
                        <div>
                          <label className="text-[11px] uppercase tracking-nav font-bold text-inkSoft">Hvilken grossist bruger du i dag?</label>
                          <select required value={form.wholesaler} onChange={e=>setForm({...form, wholesaler:e.target.value})}
                            className="mt-1.5 w-full rounded-md border border-line bg-paper px-3 py-2.5 focus:outline-none focus:border-ink">
                            <option value="">Vælg grossist…</option>
                            <option>Hørkram</option>
                            <option>Dagrofa Foodservice</option>
                            <option>BC Catering</option>
                            <option>AB Catering</option>
                            <option>Andet</option>
                          </select>
                        </div>
                        <button type="submit"
                          className="w-full mt-2 px-5 py-3.5 rounded-full bg-coral text-paper font-semibold tracking-wide hover:bg-coralDk transition-all shadow-card hover:shadow-cardHover">
                          Validér CVR & lås priser op
                        </button>
                        <p className="text-[11px] text-inkMute leading-relaxed">
                          Ved at indsende accepterer du, at Dencon Foods kontakter dig vedr. dit koncept.
                          Vi deler ikke dine oplysninger.
                        </p>
                      </form>
                    </div>
                  </div>
                ) : (
                  <div className="mt-12 rounded-2xl bg-paper border border-line p-6 sm:p-10 shadow-card fade-in">
                    <div className="flex items-start gap-3">
                      <div className="w-10 h-10 rounded-full bg-coral text-paper grid place-items-center font-bold">✓</div>
                      <div>
                        <h3 className="font-display text-3xl font-semibold text-ink">
                          Tak {form.name?.split(' ')[0] || ''} — CVR {form.cvr} er godkendt
                        </h3>
                        <p className="text-sm text-inkSoft mt-1">
                          Vi har sendt en kopi til <strong className="text-ink">{form.email}</strong>. Justér gæsteantal nedenfor for at se din ugeøkonomi.
                        </p>
                      </div>
                    </div>

                    <div className="mt-6 rounded-lg bg-cream border border-line p-5">
                      <div className="flex items-baseline justify-between flex-wrap gap-3">
                        <div>
                          <div className="text-[10px] uppercase tracking-nav text-coral font-bold">Kuvert-beregner</div>
                          <div className="font-display text-2xl font-semibold text-ink">{guests.toLocaleString('da-DK')} gæster pr. uge</div>
                        </div>
                        <div className="text-right">
                          <div className="text-[10px] uppercase tracking-nav text-inkMute">Ugentlig vareomkostning</div>
                          <div className="font-display text-3xl font-semibold text-ink">{Math.round(totals.weekly).toLocaleString('da-DK')} kr.</div>
                        </div>
                      </div>
                      <input
                        type="range" min="50" max="2000" step="10"
                        value={guests} onChange={e=>setGuests(parseInt(e.target.value))}
                        style={{'--p': `${sliderPct}%`}}
                        className="w-full mt-4"
                      />
                      <div className="flex justify-between text-[10px] uppercase tracking-nav text-inkMute mt-1">
                        <span>50</span><span>500</span><span>1000</span><span>2000</span>
                      </div>
                      <div className="grid sm:grid-cols-3 gap-3 mt-5">
                        <div className="rounded-md bg-paper border border-line p-3 text-center">
                          <div className="text-[10px] uppercase tracking-nav text-inkMute">{plates.length===1?'Portionspris':'Gns. portion'}</div>
                          <div className="font-display font-semibold text-ink text-xl">{totals.avgPortion.toFixed(2)} kr.</div>
                        </div>
                        <div className="rounded-md bg-paper border border-line p-3 text-center">
                          <div className="text-[10px] uppercase tracking-nav text-inkMute">Pr. måned (4 uger)</div>
                          <div className="font-display font-semibold text-ink text-xl">{Math.round(totals.weekly*4).toLocaleString('da-DK')} kr.</div>
                        </div>
                        <div className="rounded-md bg-paper border border-line p-3 text-center">
                          <div className="text-[10px] uppercase tracking-nav text-inkMute">Pr. år (50 uger)</div>
                          <div className="font-display font-semibold text-ink text-xl">{Math.round(totals.weekly*50).toLocaleString('da-DK')} kr.</div>
                        </div>
                      </div>
                    </div>

                    <div className="grid sm:grid-cols-2 gap-3 mt-6">
                      <button onClick={() => window.print()}
                        className="px-5 py-3.5 rounded-full bg-coral text-paper font-semibold tracking-wide hover:bg-coralDk transition-all shadow-card hover:shadow-cardHover">
                        ⬇ Download PDF
                      </button>
                      <button onClick={resetAll}
                        className="px-5 py-3.5 rounded-full border border-ink text-ink font-semibold tracking-wide hover:bg-ink hover:text-paper transition-all">
                        Byg et nyt koncept
                      </button>
                    </div>
                  </div>
                )}

                <div className="mt-8">
                  <button onClick={() => setStep(4)} className="text-sm text-inkSoft hover:text-coral">← Tilbage og justér detaljer</button>
                </div>
              </section>
            )}
          </main>

          <DenconFooter />

          <button onClick={() => window.scrollTo({top:0,behavior:'smooth'})}
            aria-label="Til toppen"
            className="fixed bottom-6 right-6 w-12 h-12 rounded-md dencon-pill grid place-items-center shadow-cardHover text-xl">
            ↑
          </button>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
