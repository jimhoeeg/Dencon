          <div className="text-xs uppercase tracking-wider text-gold font-bold mb-2">💡 Vidste du?</div>
          <p className="text-sm text-ink/80 leading-relaxed">{item.fact}</p>
          <div className="grid grid-cols-3 gap-2 mt-4">
            <div className="rounded-lg bg-white border border-sand p-2 text-center">
              <div className="text-base font-bold text-dencon-700">{item.prepMinutes}m</div>
              <div className="text-[10px] uppercase tracking-wider text-ink/50">Tilberedning</div>
            </div>
            <div className="rounded-lg bg-white border border-sand p-2 text-center">
              <div className="text-base font-bold text-dencon-700">-{item.co2Reduction}%</div>
              <div className="text-[10px] uppercase tracking-wider text-ink/50">CO₂</div>
            </div>
            <div className="rounded-lg bg-white border border-sand p-2 text-center">
              <div className="text-base font-bold text-dencon-700">-{100-item.wasteReduction === 0 ? 100 : item.wasteReduction}%</div>
              <div className="text-[10px] uppercase tracking-wider text-ink/50">Svind</div>
            </div>
          </div>
        </div>
      );
    }

    // Statusbar over alle trin
    function StatusBar({ step }) {
      const steps = ["Spisesituation", "Profil", "Tallerken", "Koncept"];
      return (
        <div className="w-full">
          <ol className="flex items-center justify-between gap-2">
            {steps.map((label, i) => {
              const idx = i + 1;
              const done = step > idx;
              const active = step === idx;
              return (
                <li key={label} className="flex-1 flex items-center gap-2 min-w-0">
                  <div className={`shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold border-2 transition-all
                    ${done ? 'bg-dencon-600 text-white border-dencon-600' :
                      active ? 'bg-white text-dencon-700 border-dencon-600' :
                              'bg-white text-ink/40 border-sand'}`}>
                    {done ? '✓' : idx}
                  </div>
                  <span className={`truncate text-xs sm:text-sm font-medium
                    ${active ? 'text-dencon-800' : done ? 'text-dencon-600' : 'text-ink/40'}`}>{label}</span>
                  {i < steps.length - 1 && (
                    <div className={`hidden sm:block h-px flex-1 ${done ? 'bg-dencon-600' : 'bg-sand'}`} />
                  )}
                </li>
              );
            })}
          </ol>
        </div>
      );
    }

    // Filtrér produkter ud fra valgt profil (tags)
    function filterByProfile(list, profileId) {
      // Hvis profilen ikke findes som tag, vis alle (defensiv default).
      const filtered = list.filter(p => p.tags?.includes(profileId));
      return filtered.length ? filtered : list;
    }

    function App() {
      const [step, setStep] = useState(1);
      const [situation, setSituation] = useState(null);   // id
      const [profile, setProfile] = useState(null);       // id
      const [picks, setPicks] = useState({ protein: null, base: null, topping: null });
      const [lastTouched, setLastTouched] = useState(null); // hvilken type blev senest valgt → knowledge-box
      const [unlocked, setUnlocked] = useState(false);
      const [form, setForm] = useState({ name:'', email:'', company:'', kitchen:'', wholesaler:'' });
      const [guests, setGuests] = useState(250); // gæster pr. uge (kuvertberegner)

      // Brug situation+profil til at finde de tre lister
      const situationObj = SITUATIONS.find(s => s.id === situation);
      const lists = useMemo(() => {
        if (!situationObj || !profile) return { protein: [], base: [], topping: [] };
        const key = situationObj.productKey;
        return {
          protein: filterByProfile(PRODUCTS.protein[key],  profile),
          base:    filterByProfile(PRODUCTS.base[key],     profile),
          topping: filterByProfile(PRODUCTS.topping[key],  profile),
        };
      }, [situationObj, profile]);

      // Selected produkter (fulde objekter)
      const selectedProducts = useMemo(() => ({
        protein: lists.protein.find(p => p.id === picks.protein) || null,
        base:    lists.base.find(p => p.id === picks.base)       || null,
        topping: lists.topping.find(p => p.id === picks.topping) || null,
      }), [lists, picks]);

      const lastTouchedItem = lastTouched ? selectedProducts[lastTouched] : null;

      // Sum-værdier til økonomi-sektionen
      const totals = useMemo(() => {
        const items = Object.values(selectedProducts).filter(Boolean);
        const pricePerPortion = items.reduce((s,x) => s + x.pricePerPortion, 0);
        const prepMinutes     = Math.max(...items.map(x => x.prepMinutes), 0);
        const avgCO2          = items.length ? Math.round(items.reduce((s,x)=>s+x.co2Reduction,0)/items.length) : 0;
        const weekly          = pricePerPortion * guests;
        return { pricePerPortion, prepMinutes, avgCO2, weekly };
      }, [selectedProducts, guests]);

      const allPicked = picks.protein && picks.base && picks.topping;

      function pickIngredient(type, id) {
        setPicks(prev => ({ ...prev, [type]: id }));
        setLastTouched(type);
      }

      function resetAll() {
        setStep(1); setSituation(null); setProfile(null);
        setPicks({ protein:null, base:null, topping:null });
        setLastTouched(null); setUnlocked(false);
        setForm({ name:'', email:'', company:'', kitchen:'', wholesaler:'' });
        setGuests(250);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function submitForm(e) {
        e.preventDefault();
        // Simuleret lead-submit. Skift til rigtigt API-kald.
        // fetch('/api/leads', { method:'POST', body: JSON.stringify(form) })
        setUnlocked(true);
      }

      // Auto-scroll til top ved trin-skift
      useEffect(() => { window.scrollTo({ top: 0, behavior: 'smooth' }); }, [step]);

      // Range-slider visuel fill
      const sliderPct = Math.round(((guests - 50) / (2000 - 50)) * 100);

                <div className="w-9 h-9 rounded-lg bg-cream flex items-center justify-center text-dencon-700 font-display font-extrabold">D</div>
                <div>
                  <div className="text-sm font-semibold tracking-wide">DENCON FOODS</div>
                  <div className="text-[11px] text-cream/70 -mt-0.5">B2B Foodservice · Koncept-Byggeren</div>
                </div>
              </div>
              <button onClick={resetAll} className="text-xs sm:text-sm text-cream/80 hover:text-white underline underline-offset-4">
                Start forfra
              </button>
            </div>
          </header>

          {/* Status bar */}
          <div className="bg-white border-b border-sand sticky top-0 z-10">
            <div className="max-w-6xl mx-auto px-4 sm:px-6 py-3">
              <StatusBar step={step} />
            </div>
          </div>

          <main className="max-w-6xl mx-auto px-4 sm:px-6 py-8 sm:py-12">

            {/* ========================= TRIN 1 ========================= */}
            {step === 1 && (

                </div>
                <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-4 mt-8">
                  {SITUATIONS.map(s =>
                    <SituationCard key={s.id} s={s} selected={situation===s.id} onClick={() => setSituation(s.id)} />
                  )}
                </div>
                <div className="mt-8 flex justify-end">
                  <button
                    disabled={!situation}
                    onClick={() => setStep(2)}
                    className={`px-6 py-3 rounded-xl font-semibold transition-all
                      ${situation ? 'bg-dencon-600 text-white hover:bg-dencon-700 shadow-card hover:shadow-cardHover'
                                  : 'bg-sand text-ink/40 cursor-not-allowed'}`}>
                    Fortsæt →
                  </button>
                </div>
              </section>
            )}

            {/* ========================= TRIN 2 ========================= */}

                </div>
                <div className="grid sm:grid-cols-3 gap-4 mt-8">
                  {PROFILES.map(p =>

                <div className="mt-8 flex items-center justify-between">
                  <button onClick={() => setStep(1)} className="text-sm text-ink/60 hover:text-dencon-700">← Tilbage</button>

                <div className="grid lg:grid-cols-3 gap-6 mt-8">

                        {['protein','base','topping'].map(k => (

                    Se mit koncept →
                  </button>
                </div>
              </section>

            {/* ========================= TRIN 4 ========================= */}
            {step === 4 && (
              <section className="fade-in">
                <div className="rounded-3xl bg-gradient-to-br from-dencon-700 to-dencon-800 text-white p-8 sm:p-12 shadow-cardHover relative overflow-hidden">

                  <div className="grid sm:grid-cols-3 gap-3 mt-6">
                    <div className="rounded-xl bg-white/10 backdrop-blur p-4">
                      <div className="text-[11px] uppercase tracking-wider text-cream/70">Klar på</div>
                      <div className="text-2xl font-bold">{totals.prepMinutes} min</div>
                      <div className="text-xs text-cream/70">i konvektovn / pande</div>
                    </div>
                    <div className="rounded-xl bg-white/10 backdrop-blur p-4">
                      <div className="text-[11px] uppercase tracking-wider text-cream/70">CO₂-reduktion</div>
                      <div className="text-2xl font-bold">-{totals.avgCO2}%</div>
                      <div className="text-xs text-cream/70">gns. pr. komponent</div>
                    </div>
                    <div className="rounded-xl bg-white/10 backdrop-blur p-4">
                      <div className="text-[11px] uppercase tracking-wider text-cream/70">Svind</div>
                      <div className="text-2xl font-bold">~0%</div>
                      <div className="text-xs text-cream/70">færdigtilberedte komponenter</div>

                  <div className="lg:col-span-2 rounded-2xl bg-white border border-sand p-6 shadow-card">

                    <ul className="mt-4 divide-y divide-sand">
                      {[
                        { label:'Protein', item: selectedProducts.protein },
                        { label:'Brød / Bund', item: selectedProducts.base },

                    <div className="mt-6 rounded-xl bg-cream border border-sand p-4">
                      <div className="text-[11px] uppercase tracking-wider text-gold font-bold mb-1">Køkkenvejledning</div>
                      <p className="text-sm text-ink/80">
                        Klar på <strong>{totals.prepMinutes} minutter</strong> i konvektovn ved 180°C.

                  </div>

                  {/* Pris-sektion (sløret indtil lead-form) */}
                  <div className="relative rounded-2xl bg-white border border-sand p-6 shadow-card">
                    {!unlocked && (
                      <div className="absolute inset-0 rounded-2xl bg-white/70 backdrop-blur-[2px] z-10 flex flex-col items-center justify-center text-center p-6">
                        <div className="text-3xl">🔒</div>

                        <div className="text-xs text-ink/60 mt-1 max-w-[18rem]">Udfyld formularen nedenfor for at se din portionspris, ugeøkonomi og varenumre.</div>

                    <h2 className="font-display text-xl font-bold text-dencon-800">Økonomi & priser</h2>
                    <div className={!unlocked ? "blurred mt-4" : "mt-4"}>
                      <div className="space-y-3">
                        <div className="flex items-baseline justify-between">
                          <span className="text-sm text-ink/60">Portionspris</span>
                          <span className="font-bold text-dencon-800 text-lg">{totals.pricePerPortion.toFixed(2)} kr.</span>
                        </div>
                        <div className="flex items-baseline justify-between">
                          <span className="text-sm text-ink/60">Pr. uge ({guests} gæster)</span>
                          <span className="font-bold text-dencon-800 text-lg">{Math.round(totals.weekly).toLocaleString('da-DK')} kr.</span>
                        </div>
                        <div className="pt-3 border-t border-sand">
                          <div className="text-[11px] uppercase tracking-wider text-ink/50 font-semibold mb-2">Varenumre hos grossist</div>
                          <ul className="text-xs space-y-1">
                            {Object.values(selectedProducts).filter(Boolean).map(p => (

                                <span className="text-ink/70">{p.name}</span>

                  <div className="mt-8 rounded-2xl bg-dencon-50 border border-dencon-200 p-6 sm:p-8">
                    <div className="grid lg:grid-cols-2 gap-6 items-start">
                      <div>

                          <li className="flex gap-2"><span>✓</span> Varenumre til din grossist</li>

                        <div>
                          <div className="text-[11px] uppercase tracking-wider text-gold font-bold">Kuvert-beregner</div>
                          <div className="font-display text-xl font-bold text-dencon-800">{guests.toLocaleString('da-DK')} gæster pr. uge</div>
                        </div>
                        <div className="text-right">
                          <div className="text-[11px] uppercase tracking-wider text-ink/50">Ugentlig vareomkostning</div>
                          <div className="font-display text-2xl font-bold text-dencon-700">{Math.round(totals.weekly).toLocaleString('da-DK')} kr.</div>
                        </div>
                      </div>
                      <input
                        type="range" min="50" max="2000" step="10"
                        value={guests} onChange={e=>setGuests(parseInt(e.target.value))}
                        style={{'--p': `${sliderPct}%`}}
                        className="w-full mt-4"
                      />
                      <div className="flex justify-between text-[11px] text-ink/50 mt-1">
                        <span>50</span><span>500</span><span>1000</span><span>2000</span>
                      </div>
                      <div className="grid sm:grid-cols-3 gap-3 mt-5">
                        <div className="rounded-lg bg-white border border-sand p-3 text-center">
                          <div className="text-[11px] uppercase tracking-wider text-ink/50">Portionspris</div>
                          <div className="font-bold text-dencon-800 text-lg">{totals.pricePerPortion.toFixed(2)} kr.</div>
                        </div>
                        <div className="rounded-lg bg-white border border-sand p-3 text-center">
                          <div className="text-[11px] uppercase tracking-wider text-ink/50">Pr. måned (4 uger)</div>
                          <div className="font-bold text-dencon-800 text-lg">{Math.round(totals.weekly*4).toLocaleString('da-DK')} kr.</div>
                        </div>
                        <div className="rounded-lg bg-white border border-sand p-3 text-center">
                          <div className="text-[11px] uppercase tracking-wider text-ink/50">Pr. år (50 uger)</div>
                          <div className="font-bold text-dencon-800 text-lg">{Math.round(totals.weekly*50).toLocaleString('da-DK')} kr.</div>
                        </div>
                      </div>
                    </div>

                    {/* Varenumre + handlinger */}
                    <div className="grid sm:grid-cols-2 gap-3 mt-6">
                      <button onClick={() => window.print()}
                        className="px-5 py-3 rounded-xl bg-dencon-600 text-white font-semibold hover:bg-dencon-700 transition-all shadow-card hover:shadow-cardHover">
                        ⬇ Download PDF
                      </button>
                      <button onClick={resetAll}
                        className="px-5 py-3 rounded-xl border border-dencon-600 text-dencon-700 font-semibold hover:bg-dencon-50 transition-all">
                        Byg et nyt koncept
                      </button>
                    </div>
                  </div>
                )}

                <div className="mt-8">
                  <button onClick={() => setStep(3)} className="text-sm text-ink/60 hover:text-dencon-700">← Tilbage og justér tallerken</button>
                </div>
              </section>
            )}
          </main>

          <footer className="mt-12 border-t border-sand bg-white">
            <div className="max-w-6xl mx-auto px-4 sm:px-6 py-6 text-xs text-ink/50 flex flex-col sm:flex-row gap-2 sm:items-center sm:justify-between">
              <div>© Dencon Foods A/S · Foodservice partner siden 1984</div>
              <div>Priser er vejledende og afhænger af din grossistaftale.</div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
